<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniMap — Navigate RSU</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="unimap.css" />
</head>
<body>

  <!-- MAP -->
  <div id="map"></div>

  <!-- STATE 1: Default — tiny search bar at base -->
  <div class="bar default-bar" id="defaultBar">
    <div class="search-wrapper" id="searchTrigger">
      <span class="search-icon">🔍</span>
      <span class="search-placeholder">Where are you headed?</span>
    </div>
  </div>

  <!-- STATE 2: Search open — full sheet -->
  <div class="full-sheet" id="fullSheet">
    <div class="sheet-inner">
      <div class="search-top">
        <button class="back-btn" id="backBtn">&#8592;</button>
        <div class="search-wrapper focused">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Where are you headed?"
            autocomplete="off"
          />
          <button class="clear-btn" id="clearBtn">✕</button>
        </div>
      </div>

      <!-- Suggestions (shown when typing) -->
      <ul class="suggestions" id="suggestions"></ul>

      <!-- Popular Places (shown by default) -->
      <div class="popular-section" id="popularSection">
        <p class="popular-label">Popular Places</p>
        <div class="popular-chips" id="popularChips"></div>
      </div>
    </div>
  </div>

  <!-- STATE 3: Location selected — navigate bar at base -->
  <div class="bar nav-bar" id="navBar">
    <div class="nav-bar-inner">
      <div class="nav-location-name" id="navLocationName"></div>
      <button class="btn-navigate" id="navigateBtn">Navigate Here</button>
    </div>
  </div>

  <!-- STATE 4: Navigating — floating controls -->
  <div class="nav-controls" id="navControls">
    <button class="btn-cancel-nav" id="cancelNavBtn">✕ Cancel Navigation</button>
  </div>

  <!-- I'm Lost (visible in states 1, 3, 4) -->
  <button class="lost-btn" id="lostBtn">
    <span>😵</span>
    <span class="lost-text">I'm Lost</span>
  </button>

  <!-- Toast -->
  <div class="toast" id="arrivedToast">
    <span class="toast-msg">You've arrived!</span>
  </div>

  <!-- Offline Banner -->
  <div class="offline-banner" id="offlineBanner">
    📵 You're offline — using cached map
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="unimap.js"></script>
</body>
</html>
