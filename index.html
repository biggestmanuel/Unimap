<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniMap — Navigate RSU</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="unimap.css" />
</head>
<body>

  <!-- MAP (top portion) -->
  <div id="map"></div>

  <!-- BOTTOM SHEET (always visible, Bolt-style) -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>

    <!-- Default state: search + popular -->
    <div class="sheet-default" id="sheetDefault">
      <div class="search-wrapper" id="searchWrapper">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Where are you headed?"
          autocomplete="off"
        />
        <button class="clear-btn" id="clearBtn">✕</button>
      </div>

      <!-- Popular Places -->
      <div class="popular-section" id="popularSection">
        <p class="popular-label">Popular Places</p>
        <div class="popular-chips" id="popularChips"></div>
      </div>
    </div>

    <!-- Search expanded state -->
    <div class="sheet-search" id="sheetSearch">
      <div class="search-top">
        <button class="back-btn" id="backBtn">&#8592;</button>
        <div class="search-wrapper focused">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="overlaySearchInput"
            class="search-input"
            placeholder="Where are you headed?"
            autocomplete="off"
          />
          <button class="clear-btn" id="overlayClearBtn">✕</button>
        </div>
      </div>
      <ul class="suggestions" id="suggestions"></ul>
    </div>

    <!-- Location selected state -->
    <div class="sheet-location" id="sheetLocation">
      <h3 class="location-name" id="locationName"></h3>
      <p class="location-desc" id="locationDesc"></p>
      <div class="card-actions">
        <button class="btn-navigate" id="navigateBtn">Navigate Here</button>
        <button class="btn-cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- I'm Lost Button -->
  <button class="lost-btn" id="lostBtn">
    <span>😵</span>
    <span class="lost-text">I'm Lost</span>
  </button>

  <!-- Toast -->
  <div class="toast" id="arrivedToast">
    <span class="toast-icon">🎉</span>
    <span class="toast-msg">You've arrived!</span>
  </div>

  <!-- Offline Banner -->
  <div class="offline-banner" id="offlineBanner">
    📵 You're offline — using cached map
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="unimap.js"></script>
</body>
</html>
